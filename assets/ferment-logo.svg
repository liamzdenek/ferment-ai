<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e" />
      <stop offset="100%" stop-color="#16213e" />
    </linearGradient>
    
    <!-- Bubbles gradient -->
    <linearGradient id="bubble-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4cc9f0" />
      <stop offset="100%" stop-color="#4361ee" />
    </linearGradient>
    
    <!-- Text gradient -->
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f72585" />
      <stop offset="50%" stop-color="#7209b7" />
      <stop offset="100%" stop-color="#3a0ca3" />
    </linearGradient>
    
    <!-- Filter for glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" rx="15" fill="url(#bg-gradient)" />
  
  <!-- Cauldron/vessel -->
  <path d="M30,150 C30,150 40,170 100,170 C160,170 170,150 170,150 L160,100 C160,90 140,85 100,85 C60,85 40,90 40,100 Z" fill="#2a2a5a" opacity="0.8" />
  <path d="M40,100 C40,95 60,90 100,90 C140,90 160,95 160,100" fill="none" stroke="#4361ee" stroke-width="2" opacity="0.6" />
  
  <!-- Cauldron handles -->
  <path d="M40,110 C30,110 25,100 30,90 C35,80 45,85 45,95" fill="none" stroke="#2a2a5a" stroke-width="4" />
  <path d="M160,110 C170,110 175,100 170,90 C165,80 155,85 155,95" fill="none" stroke="#2a2a5a" stroke-width="4" />
  
  <!-- Decorative bubbles representing fermentation -->
  <circle cx="70" cy="150" r="15" fill="url(#bubble-gradient)" opacity="0.7">
    <animate attributeName="cy" from="150" to="50" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="100" cy="160" r="10" fill="url(#bubble-gradient)" opacity="0.5">
    <animate attributeName="cy" from="160" to="40" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="130" cy="140" r="12" fill="url(#bubble-gradient)" opacity="0.6">
    <animate attributeName="cy" from="140" to="30" dur="3.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="85" cy="155" r="8" fill="url(#bubble-gradient)" opacity="0.4">
    <animate attributeName="cy" from="155" to="45" dur="4.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="115" cy="145" r="10" fill="url(#bubble-gradient)" opacity="0.5">
    <animate attributeName="cy" from="145" to="35" dur="3.2s" repeatCount="indefinite" />
  </circle>
  
  <!-- Main title -->
  <text x="400" y="110" font-family="Arial, sans-serif" font-size="60" font-weight="bold" text-anchor="middle" fill="url(#text-gradient)" filter="url(#glow)">Ferment AI</text>
  
  <!-- Tagline -->
  <text x="400" y="150" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#ffffff" opacity="0.9">Declarative Multi-Agent Systems</text>
  
  <!-- Workflow representation - moved further right -->
  <g transform="translate(620, 100) scale(0.8)">
    <rect x="0" y="0" width="40" height="40" rx="5" fill="#4cc9f0" opacity="0.8" />
    <rect x="60" y="0" width="40" height="40" rx="5" fill="#4361ee" opacity="0.8" />
    <rect x="120" y="0" width="40" height="40" rx="5" fill="#3a0ca3" opacity="0.8" />
    <line x1="40" y1="20" x2="60" y2="20" stroke="#ffffff" stroke-width="3" />
    <line x1="100" y1="20" x2="120" y2="20" stroke="#ffffff" stroke-width="3" />
  </g>
</svg>
